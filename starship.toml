"$schema" = 'https://starship.rs/config-schema.json'

# ── Layout ────────────────────────────────────────────────
format = """
[╭─](fg:bg5)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$fossil_branch\
$package\
$cmake\
$cobol\
$c\
$cpp\
$rust\
$python\
$nodejs\
$deno\
$bun\
$golang\
$java\
$kotlin\
$scala\
$php\
$perl\
$ruby\
$elixir\
$elm\
$haskell\
$haxe\
$julia\
$lua\
$nim\
$ocaml\
$rlang\
$swift\
$zig\
$fennel\
$fortran\
$conda\
$pixi\
$guix_shell\
$nix_shell\
$meson\
$xmake\
$gradle\
$buf\
$aws\
$gcloud\
$memory_usage\
$status\
$cmd_duration\
$line_break\
[╰─](fg:bg5)\
$character"""

palette = "kanagawa_dragon"

[palettes.kanagawa_dragon]
bg5 = "#393836"
gray = "#a6a69c"
green = "#87a987"
teal = "#6693bf"
blue = "#658594"
violet = "#8992a7"
red = "#c4746e"
orange = "#b6927b"
yellow = "#c4b28a"

# ── OS Settings ───────────────────────────────────────────
[os]
disabled = false
style = "fg:gray"

[os.symbols]
Alpaquita = " "
Alpine = " "
Arch = " "
Debian = " "
Fedora = " "
Linux = " "
Macos = " "
NixOS = " "
Ubuntu = " "
Windows = "󰍲 "

# ── PHP (Elephant Override) ──────────────────────────────
[php]
symbol = " "
style = "fg:violet"
format = "[$symbol($version )]($style)"

# ── All Provided Symbols ──────────────────────────────────
[aws]
symbol = " "
[buf]
symbol = " "
[bun]
symbol = " "
[c]
symbol = " "
[cpp]
symbol = " "
[cmake]
symbol = " "
[conda]
symbol = " "
[crystal]
symbol = " "
[dart]
symbol = " "
[deno]
symbol = " "
[elixir]
symbol = " "
[elm]
symbol = " "
[fennel]
symbol = " "
[fortran]
symbol = " "
[fossil_branch]
symbol = " "
[gcloud]
symbol = " "
[git_branch]
symbol = " "
[git_commit]
tag_symbol = '  '
[golang]
symbol = " "
[gradle]
symbol = " "
[guix_shell]
symbol = " "
[haskell]
symbol = " "
[haxe]
symbol = " "
[hg_branch]
symbol = " "
[hostname]
ssh_symbol = " "
[java]
symbol = " "
[julia]
symbol = " "
[kotlin]
symbol = " "
[lua]
symbol = " "
[memory_usage]
symbol = "󰍛 "
[meson]
symbol = "󰔷 "
[nim]
symbol = "󰆥 "
[nix_shell]
symbol = " "
[nodejs]
symbol = " "
[ocaml]
symbol = " "
[package]
symbol = "󰏗 "
[perl]
symbol = " "
[pijul_channel]
symbol = " "
[pixi]
symbol = "󰏗 "
[python]
symbol = " "
[rlang]
symbol = "󰟔 "
[ruby]
symbol = " "
[rust]
symbol = "󱘗 "
[scala]
symbol = " "
[status]
symbol = " "
[swift]
symbol = " "
[xmake]
symbol = " "
[zig]
symbol = " "

# ── Core Modules ──────────────────────────────────────────
[directory]
style = "fg:teal bold"
read_only = " 󰌾"
format = " [$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](fg:green bold)"
error_symbol = "[❯](fg:red bold)"

# ── Removed Docker Context as requested ──────────────────
[docker_context]
disabled = true
