set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-q
unbind C-b
bind-key C-q send-prefix

unbind %
bind = split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind x kill-pane
# Smart pane switching with Ctrl + hjkl
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# bind l switch-client -T layouts

# bind -T layouts 1 \
#   kill-pane -a \; \
#   split-window -v \; \
#   select-pane -t 1 \; \
#   split-window -h \; \
#   select-pane -t 0

# bind -T layouts Any switch-client -T root

# Bind <prefix> + l to show a layout selection menu
bind l display-menu -T "#[align=centre]Choose a layout" \
  -x R -y P \
  "1. Dev Mode"       1 "kill-pane -a \; split-window -v -c '#{pane_current_path}' \; select-pane -t 1 \; split-window -h -c '#{pane_current_path}' \; select-pane -t 0" \
  "2. Even Vertical"  2 "select-layout even-vertical" \
  "3. Even Horizontal" 3 "select-layout even-horizontal" \
  "4. Main Vertical"  4 "select-layout main-vertical" \
  "5. Main Horizontal" 5 "select-layout main-horizontal" \
  "6. Tiled"          6 "select-layout tiled"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Claude Code split-pane agent teams support
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# tpm plugin
# Initialize TPM
set -g @tpm.plugins 'https://github.com/tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

# set -g @plugin 'TanglingTreats/tmux-everforest' # Adds to the list of plugins
# set -g @tmux-everforest 'dark-medium' # Sets the option to select the theme. Also the default.
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme "kanagawa/dragon"
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-show-powerline true
# it can accept `hostname` (full hostname), `session`, `shortname` (short name), `smiley`, `window`, or any character.
set -g @ukiyo-left-icon session
set -g @ukiyo-border-contrast true
set -g @ukiyo-day-month true
set -g @ukiyo-military-time true
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @ukiyo-plugins "battery cpu-usage ram-usage time"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
