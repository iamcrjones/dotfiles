# Global language runtimes managed by mise.
# Symlinked to ~/.config/mise/config.toml by install.sh.
#
# Install/sync with:  mise install
#
# PHP uses the verzly/mise-php plugin, registered by install.sh (`mise plugins
# add php verzly/mise-php`) so it isn't compiled from source; the plugin also
# installs a dedicated Composer alongside PHP. Add more languages freely, e.g.:
#   mise use -g python@3.12   go@latest   ruby@3.3

[tools]
node = "lts"
php = "8.5"
